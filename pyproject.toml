# [LINTERS] Configuración central de Ruff + Black para el backend Python.

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    "venv",
    "*/migrations/*",
    "*/migrations/",
    "backend/backend/migrations/*",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort (imports), W: warnings, UP: pyupgrade
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",  # line too long — lo maneja Black
]

[tool.ruff.lint.isort]
known-first-party = ["store"]

[tool.black]
line-length = 120
target-version = ["py313"]
extend-exclude = """
/(
    venv
  | .*migrations
)/
"""
